name: Nordgreen Competitor Monitor

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# Prevents overlapping runs from racing each other when pushing state back.
# If a run is already in progress, a new one waits instead of colliding with it.
concurrency:
  group: nordgreen-monitor
  cancel-in-progress: false

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # full history, not a shallow clone — makes rebase reliable

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run the monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python nordgreen_monitor.py

      - name: Commit updated state and log back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nordgreen_state.json nordgreen_run_log.jsonl || true
          git diff --staged --quiet || git commit -m "Update monitor state [skip ci]"

          # Retry loop: pull-rebase and push, retrying a few times in case
          # another run pushes in the brief window between pull and push.
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push && break
            echo "Push attempt $i failed, retrying..."
            sleep 5
          done
