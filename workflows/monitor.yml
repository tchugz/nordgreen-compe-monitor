name: Nordgreen Competitor Monitor

on:
  schedule:
    # Runs every 6 hours — matches the production cadence used in the n8n version.
    # Cron is in UTC. Adjust the numbers below if you want different hours.
    - cron: '0 */6 * * *'
  workflow_dispatch: {}   # lets you trigger a manual run from the Actions tab too

jobs:
  run-monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run the monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python nordgreen_monitor.py

      - name: Commit updated state and log back to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nordgreen_state.json nordgreen_run_log.jsonl || true
          git diff --staged --quiet || git commit -m "Update monitor state [skip ci]"
          git push
